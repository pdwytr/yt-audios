services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt:ro  # mount cookies (optional)
      - ./channels.csv:/app/channels.csv:ro
    environment:
      - DATA_DIR=/app/data
      - USERS_FILE=/app/users.csv
      - CHANNELS_FILE=/app/channels.csv
      - YT_COOKIES=/app/cookies.txt  # remove if not using cookies

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
